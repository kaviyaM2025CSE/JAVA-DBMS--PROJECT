
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 40px; }
        h1 { text-align: center; color: #2c3e50; }
        table { width: 85%; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #3498db; color: white; text-transform: uppercase; font-size: 14px; }
        tr:hover { background-color: #f1f2f6; }
        .btn { background: #2ecc71; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; display: inline-block; font-weight: bold; margin-bottom: 20px; border: none; cursor: pointer; }
        .btn:hover { background: #27ae60; }
        .center-div { text-align: center; }
        
        /* Styled Badges Matrix */
        .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .status-badge.pending { background-color: #ffeaa7; color: #d63031; }
        .status-badge.completed { background-color: #badc58; color: #6ab04c; }

        /* Action Buttons Elements */
        .action-btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; display: inline-block; margin-right: 5px; transition: 0.2s; }
        .complete-btn { background-color: #38ef7d; color: white; }
        .complete-btn:hover { background-color: #11998e; }
        .pending-btn { background-color: #f0932b; color: white; }
        .pending-btn:hover { background-color: #e056fd; }
        .delete-btn { background-color: #ff7675; color: white; }
        .delete-btn:hover { background-color: #d63031; }
    </style>
</head>
<body>
    <h1>📋 Project Task Tracking Web Application</h1>
    <div class="center-div">
        <a href="add-task.html" class="btn">➕ Create New Task</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Task Title</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Available Actions</th>
            </tr>
        </thead>
        <tbody id="task-table-body">
            <!-- JavaScript will render active visual components here -->
        </tbody>
    </table>

    <script>
        function loadLiveTasks() {
            fetch('/get-tasks?t=' + new Date().getTime())
                .then(response => response.text())
                .then(data => {
                    document.getElementById('task-table-body').innerHTML = data;
                })
                .catch(err => console.log("Error loading tasks: ", err));
        }
        loadLiveTasks();
    </script>
</body>
</html>
